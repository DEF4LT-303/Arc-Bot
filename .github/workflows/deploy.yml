name: Deploy to Hostinger

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Create .env file
        run: |
          echo "DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}" > .env
          echo "CLIENT_ID=${{ secrets.CLIENT_ID }}" >> .env

      - name: Upload files to Hostinger
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || 22 }}
          source: "."
          target: ${{ secrets.HOSTINGER_DEPLOY_PATH }}/current
          strip_components: 0

      - name: Deploy and start bot on server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || 22 }}
          script: |
            cd ${{ secrets.HOSTINGER_DEPLOY_PATH }}/current
            git pull origin production
            npm install --production
            pm2 stop arc-bot || true
            pm2 delete arc-bot || true
            pm2 start ecosystem.config.js --env production --update-env
            pm2 save
            echo "✅ Bot deployed and started with PM2"

            # Register slash commands
            node deploy-commands.js
            echo "✅ Slash commands registered"
